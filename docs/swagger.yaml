openapi: 3.0.3
info:
  title: API Backend - Centro Médico Salud Integral
  description: "Documentación completa y definitiva de la API REST interna (Flask) para el Hito 2.\nIncluye todos los módulos ABM, Agendas, Turnos (con restricciones de negocio y QR) y \nrelación Médico-Cobertura.\n"
  version: 1.0.0
servers:
- url: https://virtserver.swaggerhub.com/myself-0fe/Centro-Medico/1.0.0
  description: SwaggerHub API Auto Mocking
- url: http://localhost:5000
  description: Servidor de Desarrollo Local
tags:
- name: Autenticación y Usuarios
  description: "Autenticación JWT y gestión de perfiles del personal."
- name: Coberturas
  description: "Gestión de Obras Sociales y Prepagas."
- name: Pacientes
  description: ABM y búsqueda de pacientes (particulares o con cobertura).
- name: Especialidades
  description: Catálogo de especialidades médicas.
- name: Consultorios
  description: Gestión de espacios físicos de atención.
- name: Médicos
  description: ABM de profesionales y configuración de coberturas aceptadas.
- name: Agendas
  description: Configuración de días y horarios semanales de atención por médico.
- name: Turnos (Reserva y Recepción)
  description: "Motor principal de generación, búsqueda, reserva, cancelación y check-in QR."
- name: Dashboards e Informes
  description: Estadísticas agregadas e indicadores clave de atención en formato JSON.
- name: Sistema
  description: Estado y disponibilidad del servicio.
security:
- bearerAuth: []
paths:
  /api/health:
    get:
      security: []
      tags:
      - Sistema
      summary: Verificar disponibilidad del servicio
      description: Health check público. La ruta interna `/health` queda expuesta como `/api/health` por el DispatcherMiddleware.
      responses:
        "200":
          description: Servicio operativo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/auth/login:
    post:
      security: []
      tags:
      - Autenticación y Usuarios
      summary: Iniciar sesión
      description: "Valida las credenciales del usuario (correo y contraseña). Si son correctas, \nemite un JWT sin crear una sesión persistente en el servidor y devuelve el token \njunto con los datos básicos y el rol del usuario. El cliente debe enviar el token \ncomo Bearer en las solicitudes a endpoints protegidos.\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Autenticación exitosa. Retorna información del perfil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Credenciales inválidas (correo no existe o contraseña incorrecta).
  /api/usuarios/me:
    get:
      tags:
      - Autenticación y Usuarios
      summary: Obtener el perfil del usuario logueado actualmente
      description: |
        Valida el JWT enviado como Bearer y devuelve los datos de la cuenta con
        los que el frontend reconstruye el estado de la aplicación. Además de los
        campos comunes de `usuario`, agrega el perfil correspondiente al rol:

        - Paciente (`id_rol = 3`): objeto `paciente` con cobertura y nro. de afiliado.
        - Médico (`id_rol = 4`): objeto `medico` con especialidad y matrícula.
        - Administrador (`id_rol = 1`) y Recepción (`id_rol = 2`): solo datos de cuenta.
      responses:
        "200":
          description: Perfil del usuario autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioInfo"
        "401":
          description: No autenticado o usuario inexistente.
  /api/usuarios:
    get:
      tags:
      - Autenticación y Usuarios
      summary: Listar usuarios del sistema (Admin)
      description: Retorna usuarios filtrables por rol (administrativos, pacientes y médicos).
      parameters:
      - name: rol
        in: query
        description: Filtra por el tipo de rol.
        required: false
        schema:
          type: string
          enum:
          - admin
          - recepcionista
          - paciente
          - medico
      responses:
        "200":
          description: Lista de usuarios obtenida.
        "403":
          description: Acceso denegado. Solo administradores pueden usar este endpoint.
    post:
      tags:
      - Autenticación y Usuarios
      summary: Crear usuario de Staff (Admin o Recepcionista)
      description: Permite a un Administrador dar de alta nuevas cuentas para el personal de la clínica.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioStaffRegistro"
        required: true
      responses:
        "201":
          description: Cuenta de staff creada exitosamente.
        "400":
          description: "Error de validación (correo ya existe, DNI duplicado)."
        "403":
          description: Acceso denegado (requiere rol admin).
  /api/usuarios/{id_usuario}:
    put:
      tags:
      - Autenticación y Usuarios
      summary: Actualizar datos de un usuario
      description: >-
        Permite al propio usuario editar sus datos personales. Un administrador
        puede editar cualquier cuenta.
      parameters:
      - name: id_usuario
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioUpdate"
        required: true
      responses:
        "200":
          description: Datos actualizados correctamente.
        "400":
          description: Error de validación de los datos enviados.
        "403":
          description: Acceso denegado (solo el propio usuario o un administrador).
        "404":
          description: Usuario no encontrado.
    delete:
      tags:
      - Autenticación y Usuarios
      summary: Eliminar usuario
      description: >-
        Elimina una cuenta. No permite autoeliminarse y falla si el usuario tiene
        turnos u otros registros vinculados.
      parameters:
      - name: id_usuario
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Usuario eliminado correctamente.
        "400":
          description: No se puede eliminar la propia cuenta.
        "403":
          description: Acceso denegado (requiere rol admin).
        "404":
          description: Usuario no encontrado.
        "409":
          description: El usuario está en uso y no puede eliminarse.
  /api/usuarios/{id_usuario}/password:
    put:
      tags:
      - Autenticación y Usuarios
      summary: Blanquear o actualizar contraseña
      description: >-
        Un usuario puede cambiar su propia contraseña acreditando password_actual.
        Un administrador puede restablecer la contraseña de otra cuenta de administración
        o recepción enviando solo nueva_password.
      parameters:
      - name: id_usuario
        in: path
        description: ID del usuario a modificar.
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordUpdate"
            examples:
              cambio_propio:
                value:
                  password_actual: ClaveAnterior2026!
                  nueva_password: ClaveNueva2026!
              restablecimiento_staff:
                value:
                  nueva_password: ClaveNueva2026!
        required: true
      responses:
        "200":
          description: Contraseña actualizada correctamente.
        "400":
          description: Cuerpo inválido, contraseña nueva inválida o falta la contraseña actual para un cambio propio.
        "401":
          description: Token ausente, inválido o expirado.
        "403":
          description: Permisos insuficientes o contraseña actual incorrecta.
        "404":
          description: Usuario no encontrado.
        "409":
          description: La cuenta cambió mientras se procesaba la solicitud.
  /api/coberturas:
    get:
      tags:
      - Coberturas
      summary: Listar todas las Obras Sociales / Prepagas
      description: "Retorna el catálogo completo de coberturas disponibles en la clínica (ej. OSDE, Swiss Medical)."
      responses:
        "200":
          description: Lista de coberturas.
    post:
      tags:
      - Coberturas
      summary: Crear nueva cobertura
      description: Alta de una nueva obra social o prepaga en el sistema.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NombreRequest"
        required: true
      responses:
        "201":
          description: Cobertura creada exitosamente.
        "400":
          description: Falta el nombre o la cobertura ya existe.
  /api/coberturas/{id_cobertura}:
    put:
      tags:
      - Coberturas
      summary: Modificar cobertura
      description: Actualiza el nombre o los detalles comerciales de una cobertura existente.
      parameters:
      - name: id_cobertura
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NombreRequest"
        required: true
      responses:
        "200":
          description: Cobertura modificada con éxito.
        "404":
          description: La cobertura indicada no existe.
    delete:
      tags:
      - Coberturas
      summary: Eliminar cobertura
      description: Borra lógicamente o físicamente una cobertura (solo si no tiene pacientes ni médicos asociados).
      parameters:
      - name: id_cobertura
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Cobertura eliminada.
        "409":
          description: Conflicto. No se puede eliminar porque hay pacientes/médicos que la utilizan.
  /api/pacientes:
    post:
      security: []
      tags:
      - Pacientes
      summary: Alta de paciente (Autogestión o Recepción)
      description: |
        Endpoint público o de recepción. Crea un registro en la tabla `usuario` y su perfil en `paciente`.
        Soporta pacientes particulares (enviando `id_cobertura` nulo).
        El número de afiliado se genera automáticamente en el backend: no se recibe del cliente.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PacienteRegistro"
        required: true
      responses:
        "201":
          description: Paciente registrado exitosamente.
        "400":
          description: Error de validación (Email en uso).
    get:
      tags:
      - Pacientes
      summary: Listar pacientes (Búsqueda en Recepción)
      description: Herramienta para recepción. Permite buscar rápidamente el perfil de un paciente que llama por teléfono o llega al mostrador.
      parameters:
      - name: dni
        in: query
        description: Busca coincidencias exactas o parciales por DNI.
        required: false
        schema:
          type: string
      - name: apellido
        in: query
        description: Busca por apellido usando sentencias LIKE '%...%' en SQL.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Resultados de la búsqueda obtenidos correctamente.
  /api/pacientes/{id_paciente}:
    get:
      tags:
      - Pacientes
      summary: Obtener perfil completo del paciente
      description: "Trae todos los datos personales, de contacto y de su cobertura actual cruzando las tablas correspondientes."
      parameters:
      - name: id_paciente
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Perfil detallado del paciente.
        "404":
          description: El ID de paciente no existe.
    put:
      tags:
      - Pacientes
      summary: "Actualizar datos, cobertura o número de afiliado"
      description: Permite al paciente o recepcionista actualizar su cobertura de salud (ej. cambió de prepaga) o datos de contacto.
      parameters:
      - name: id_paciente
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PacienteUpdate"
        required: true
      responses:
        "200":
          description: Datos actualizados correctamente en la BD.
        "404":
          description: Paciente no encontrado.
  /api/pacientes/{id_paciente}/turnos:
    get:
      tags:
      - Pacientes
      summary: Historial y próximos turnos de un paciente
      description: "Devuelve el panel de control del paciente, mostrando los turnos que tiene a futuro (estado reservado) y su historial pasado (atendido, cancelado, ausente)."
      parameters:
      - name: id_paciente
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Listado cronológico de turnos del paciente.
        "404":
          description: Paciente no encontrado.
  /api/especialidades:
    get:
      tags:
      - Especialidades
      summary: Listar especialidades
      description: "Devuelve el catálogo médico completo (Clínica Médica, Cardiología, Pediatría, etc)."
      responses:
        "200":
          description: Lista de especialidades obtenida.
    post:
      tags:
      - Especialidades
      summary: Crear especialidad
      description: Da de alta una nueva rama médica en el sistema.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NombreRequest"
        required: true
      responses:
        "201":
          description: Especialidad creada.
        "400":
          description: Nombre inválido o duplicado.
  /api/especialidades/{id_especialidad}:
    put:
      tags:
      - Especialidades
      summary: Modificar especialidad
      description: Permite corregir errores de tipeo en el nombre de la especialidad.
      parameters:
      - name: id_especialidad
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NombreRequest"
        required: true
      responses:
        "200":
          description: Modificación exitosa.
        "404":
          description: Especialidad no existe.
    delete:
      tags:
      - Especialidades
      summary: Eliminar especialidad
      description: Borra la especialidad (restringido si ya hay médicos asignados a ella).
      parameters:
      - name: id_especialidad
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Especialidad eliminada.
        "409":
          description: No se puede eliminar. Hay médicos asociados a esta especialidad.
  /api/consultorios:
    get:
      tags:
      - Consultorios
      summary: Listar consultorios
      description: Obtiene la lista de espacios físicos habilitados en la clínica.
      responses:
        "200":
          description: Listado de consultorios.
    post:
      tags:
      - Consultorios
      summary: Crear consultorio
      description: "Da de alta un nuevo espacio (ej. \"Consultorio 4, Piso 1\")."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultorioRequest"
        required: true
      responses:
        "201":
          description: Consultorio creado exitosamente.
  /api/consultorios/{id_consultorio}:
    put:
      tags:
      - Consultorios
      summary: Modificar consultorio
      description: Actualiza el número o piso de un consultorio existente.
      parameters:
      - name: id_consultorio
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultorioRequest"
        required: true
      responses:
        "200":
          description: Consultorio actualizado.
        "404":
          description: El consultorio no existe.
    delete:
      tags:
      - Consultorios
      summary: Eliminar consultorio
      description: Baja de un consultorio físico (restringido si está en agendas activas).
      parameters:
      - name: id_consultorio
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Consultorio eliminado.
        "409":
          description: No se puede eliminar por estar vinculado a turnos/agendas.
  /api/medicos:
    get:
      tags:
      - Médicos
      summary: Buscar médicos
      description: Busca profesionales en la cartilla. Soporta múltiples filtros cruzados con tablas intermedias.
      parameters:
      - name: id_especialidad
        in: query
        description: Filtra médicos por especialidad (ej. Solo Traumatólogos).
        required: false
        schema:
          type: integer
      - name: id_cobertura
        in: query
        description: Filtra médicos que atienden por una obra social específica (JOIN con `cobertura_medico`).
        required: false
        schema:
          type: integer
      - name: nombre
        in: query
        description: Búsqueda parcial por nombre o apellido.
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Lista de médicos devuelta con éxito.
    post:
      tags:
      - Médicos
      summary: Crear médico
      description: Genera el usuario de acceso para el médico y su perfil profesional en el sistema.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicoRegistro"
        required: true
      responses:
        "201":
          description: Perfil médico creado exitosamente.
        "400":
          description: Error de validación, especialidad inexistente o correo o matrícula duplicados.
        "403":
          description: Acceso denegado (requiere rol administrador).
  /api/medicos/{id_medico}:
    get:
      tags:
      - Médicos
      summary: Ver perfil del médico
      description: "Trae los datos personales, matrícula y especialidad del profesional."
      parameters:
      - name: id_medico
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Perfil médico detallado.
        "404":
          description: Médico no encontrado.
    put:
      tags:
      - Médicos
      summary: Modificar la especialidad del médico
      description: Actualiza la especialidad asignada al profesional.
      parameters:
      - name: id_medico
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicoUpdate"
        required: true
      responses:
        "200":
          description: Especialidad actualizada.
        "400":
          description: La especialidad indicada no existe o el cuerpo no es válido.
        "404":
          description: Médico no encontrado.
    delete:
      tags:
      - Médicos
      summary: Eliminar médico
      description: Elimina al médico, sus vínculos de cobertura y agendas vacías. No se permite si tiene turnos asociados.
      parameters:
      - name: id_medico
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Profesional eliminado.
        "404":
          description: Médico no encontrado.
        "409":
          description: No se puede eliminar porque tiene turnos u otros datos asociados.
  /api/medicos/{id_medico}/coberturas:
    get:
      tags:
      - Médicos
      summary: Listar obras sociales que acepta el médico
      description: Consulta la tabla intermedia `cobertura_medico` para saber qué prepagas trabaja el doctor.
      parameters:
      - name: id_medico
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Lista de coberturas aceptadas.
    post:
      tags:
      - Médicos
      summary: Vincular médico con una cobertura
      description: Crea un registro en la tabla intermedia indicando que el médico ahora atiende por esta obra social.
      parameters:
      - name: id_medico
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/id_medico_coberturas_body"
        required: true
      responses:
        "201":
          description: Cobertura vinculada exitosamente al médico.
        "400":
          description: Body inválido o id de cobertura incorrecto.
        "403":
          description: Acceso denegado (solo el propio médico o un administrador).
        "404":
          description: Médico o cobertura no encontrados.
        "409":
          description: El vínculo ya existe.
  /api/medicos/{id_medico}/coberturas/{id_cobertura}:
    delete:
      tags:
      - Médicos
      summary: Desvincular médico de una cobertura
      description: Elimina el registro de la tabla intermedia si el médico deja de atender por dicha prepaga.
      parameters:
      - name: id_medico
        in: path
        required: true
        schema:
          type: integer
      - name: id_cobertura
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Vínculo eliminado.
  /api/agendas:
    get:
      tags:
      - Agendas
      summary: Listar agendas con filtros ampliados
      description: Herramienta administrativa para consultar qué médico atiende en qué días y consultorios.
      parameters:
      - name: id_medico
        in: query
        description: Agendas de un profesional específico.
        required: false
        schema:
          type: integer
      - name: id_consultorio
        in: query
        description: Ver quién ocupa un consultorio.
        required: false
        schema:
          type: integer
      - name: vigente
        in: query
        description: "Si es true, solo trae agendas donde `fecha_hasta` sea mayor o igual a hoy."
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: Grilla de agendas obtenida.
    post:
      tags:
      - Agendas
      summary: Crear nueva agenda semanal
      description: "Impacta en dos tablas: Crea la cabecera en `agenda` y los días/horarios recurrentes en `agenda_dias`. \nEstablece la duración del turno y el rango de validez (ej. \"Del 1 de Nov al 31 de Dic, atiende los Lunes y Miércoles de 9 a 12\").\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaConfig"
        required: true
      responses:
        "201":
          description: Agenda configurada exitosamente.
        "400":
          description: Conflicto lógico (el consultorio ya está asignado a otro médico en ese horario).
  /api/agendas/{id_agenda}:
    get:
      tags:
      - Agendas
      summary: Ver detalle de agenda
      description: Trae la cabecera de la agenda y un JOIN con todos sus días y franjas horarias.
      parameters:
      - name: id_agenda
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Detalle estructural de la agenda.
        "404":
          description: Agenda no encontrada.
    put:
      tags:
      - Agendas
      summary: Modificar agenda
      description: Permite acortar o extender la `fecha_hasta` de una agenda vigente.
      parameters:
      - name: id_agenda
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaUpdate"
        required: true
      responses:
        "200":
          description: Agenda modificada con éxito.
        "400":
          description: La nueva fecha es anterior a la fecha de inicio.
        "404":
          description: Agenda no encontrada.
    delete:
      tags:
      - Agendas
      summary: Eliminar agenda (si no tiene turnos)
      description: Borra la agenda. Solo permitido si aún no se han generado y reservado turnos que dependan de ella.
      parameters:
      - name: id_agenda
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Agenda eliminada.
        "409":
          description: Error. Hay turnos vinculados a esta agenda que no pueden quedar huérfanos.
  /api/turnos/generar:
    post:
      tags:
      - Turnos (Reserva y Recepción)
      summary: Generar turnos disponibles por bloque mensual/semanal
      description: "Ejecuta la apertura manual de agendas para el mes siguiente. Solo se permite a partir del día 15 del mes actual (hora local configurada).\nEl backend itera sobre los días configurados en la agenda, calcula las franjas \nhorarias sumando la duración, y realiza un INSERT masivo en la tabla `turno` \ncon estado `disponible` y el `id_paciente` en valor `NULL`.\n"
      responses:
        "200":
          description: Turnos generados exitosamente en la base de datos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnosGenerarResponse"
        "409":
          description: La apertura de agendas todavía no está habilitada para el mes actual.
  /api/turnos/disponibles:
    get:
      tags:
      - Turnos (Reserva y Recepción)
      summary: Buscar turnos libres (Frontend Paciente) con filtros avanzados
      description: "Motor de búsqueda para pacientes. Solo retorna registros de la tabla `turno` \ndonde `id_estado` sea \"disponible\" (o equivalente) e `id_paciente` sea nulo.\nUtiliza INNER JOINs para aplicar filtros de especialidad y cobertura.\n"
      parameters:
      - name: id_especialidad
        in: query
        description: Filtra turnos libres de una rama específica (Ej. Odontología).
        required: false
        schema:
          type: integer
      - name: id_medico
        in: query
        description: Si el paciente busca un doctor en particular.
        required: false
        schema:
          type: integer
      - name: id_cobertura
        in: query
        description: Excluye los turnos de médicos que no atiendan la obra social del paciente (Supuesto 10).
        required: false
        schema:
          type: integer
      - name: fecha_desde
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: fecha_hasta
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: hora_desde
        in: query
        description: Permite buscar "turnos por la tarde" filtrando la hora.
        required: false
        schema:
          type: string
          format: time
      - name: hora_hasta
        in: query
        required: false
        schema:
          type: string
          format: time
      responses:
        "200":
          description: Listado de franjas horarias disponibles.
  /api/turnos:
    get:
      tags:
      - Turnos (Reserva y Recepción)
      summary: Grilla general de turnos (Backoffice Recepción)
      description: "Vista maestra para los recepcionistas. Permite ver todos los turnos (disponibles, \nreservados, atendidos, ausentes) para administrar el flujo de la sala de espera.\n"
      parameters:
      - name: fecha_desde
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: fecha_hasta
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: id_medico
        in: query
        description: Ver la grilla de un médico puntual del día de hoy.
        required: false
        schema:
          type: integer
      - name: id_estado
        in: query
        description: Filtrar por ejemplo solo los "Reservados".
        required: false
        schema:
          type: integer
      responses:
        "200":
          description: Tabla general devuelta exitosamente.
  /api/turnos/{id_turno}:
    get:
      tags:
      - Turnos (Reserva y Recepción)
      summary: Obtener el detalle completo de un turno específico
      description: >-
        Devuelve el turno con su estado, fechas, paciente, médico, consultorio,
        cobertura del paciente y código QR asignado. Administración y recepción
        pueden consultar cualquier turno. Los pacientes consultan sus turnos y
        los médicos los que pertenecen a sus agendas.
      parameters:
      - name: id_turno
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Objeto turno con los datos del detalle. Paciente, cobertura y código QR pueden ser nulos.
        "401":
          description: Token ausente, inválido o expirado.
        "403":
          description: Rol sin acceso a los turnos.
        "404":
          description: El turno no existe o no es visible para el usuario.
  /api/turnos/checkin:
    post:
      tags:
      - Turnos (Reserva y Recepción)
      summary: Escaneo de QR en recepción
      description: "Endpoint protegido de uso exclusivo del personal. Recibe el token (hash/UUID) del QR \ndel paciente. Valida que el estado sea \"reservado\" y verifica la tolerancia temporal \n(-30 min a +15 min). Si es correcto, graba la `fecha_horario_llegada` y pasa el estado a \"confirmado\".\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/turnos_checkin_body"
        required: true
      responses:
        "200":
          description: Check-in exitoso o llegada ya registrada previamente; en ambos casos se conserva la hora original de llegada.
        "400":
          description: Token QR inválido o cuerpo de la solicitud inválido.
        "404":
          description: El QR no pertenece a un turno existente.
        "409":
          description: Turno fuera del rango horario permitido o que ya no está reservado.
  /api/turnos/{id_turno}/reservar:
    post:
      tags:
      - Turnos (Reserva y Recepción)
      summary: Reservar turno y enviar QR
      description: "El paciente toma un turno \"disponible\". El backend verifica que siga libre (manejo \nde concurrencia), asigna el `id_paciente`, cambia el estado a \"reservado\", genera un \nhash para el campo `codigo_qr` y dispara la rutina de envío de correo SMTP con la imagen adjunta.\n"
      parameters:
      - name: id_turno
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/id_turno_reservar_body"
        required: true
      responses:
        "200":
          description: Reserva concretada y correo enviado con éxito.
        "409":
          description: Conflicto. Alguien más reservó el turno segundos antes.
  /api/turnos/{id_turno}/cancelar:
    get:
      tags:
      - Turnos (Reserva y Recepción)
      summary: Cancelar reserva desde el enlace del comprobante
      description: "Endpoint usado por el correo del comprobante. Valida el token firmado del enlace y cancela la reserva asociada al turno y al paciente. Es público por diseño para permitir la cancelación desde el email sin autenticación. El paciente solo puede cancelar hasta 24 horas antes del turno, inclusive.\n"
      parameters:
      - name: id_turno
        in: path
        required: true
        schema:
          type: integer
      - name: token
        in: query
        description: Token firmado que identifica la reserva y expira en un tiempo acotado.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Turno cancelado correctamente desde el enlace de correo.
        "400":
          description: Token inválido, expirado o inconsistente con el turno.
        "404":
          description: El turno o el paciente asociado ya no existen.
  /api/turnos/cancelar:
    post:
      tags:
      - Turnos (Reserva y Recepción)
      summary: Cancelar reserva y liberar disponibilidad
      description: "Cancela un turno reservado desde el backoffice o sesión autenticada. Conserva la fila cancelada con los datos del paciente para el historial y crea una nueva fila disponible para el mismo horario. El paciente solo puede cancelar hasta 24 horas antes del turno, inclusive; el personal no tiene ese límite."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - id_turno
              properties:
                id_turno:
                  type: integer
        required: true
      responses:
        "200":
          description: Turno cancelado correctamente.
        "400":
          description: El identificador del turno es inválido.
        "403":
          description: El turno no pertenece al paciente autenticado.
        "404":
          description: Turno no encontrado.
        "409":
          description: El turno no se encuentra reservado o el paciente intenta cancelar fuera del plazo de 24 horas.
  /api/turnos/{id_turno}/estado:
    put:
      tags:
      - Turnos (Reserva y Recepción)
      summary: "Modificar manualmente el estado de un turno (Atendido, Ausente)"
      description: >-
        Administración y recepción pueden marcar atendido un turno confirmado
        y ausente un turno reservado sin llegada, una vez superados los 15
        minutos de tolerancia. Repetir el estado final devuelve 200.
      parameters:
      - name: id_turno
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TurnoEstadoUpdate"
        required: true
      responses:
        "200":
          description: Estado solicitado aplicado o ya vigente. Devuelve mensaje, id_turno, id_estado y estado.
        "400":
          description: Cuerpo inválido, estado no permitido o transición inválida.
        "401":
          description: Token ausente, inválido o expirado.
        "403":
          description: Requiere rol administrador o recepcionista.
        "404":
          description: Turno no encontrado.
        "409":
          description: El turno cambió mientras se procesaba la solicitud.
  /api/estadisticas/sala_espera:
    get:
      tags:
      - Dashboards e Informes
      summary: Lista de pacientes aguardando ser atendidos
      description: Cruza la tabla `turno` filtrando por el día de hoy y el estado "confirmado" (check-in realizado). Ordenado por hora de llegada.
      responses:
        "200":
          description: Lista de espera generada.
  /api/estadisticas/turnos:
    get:
      tags:
      - Dashboards e Informes
      summary: "Agrupamiento de estados (Atendidos, Ausentes, etc) para gráficos"
      description: Ejecuta sentencias `COUNT` y `GROUP BY id_estado` para alimentar gráficos de torta/barras sobre presentismo y cancelación.
      parameters:
      - name: fecha_desde
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: fecha_hasta
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: Diccionario JSON con los recuentos estadísticos.
  /api/estadisticas/ocupacion_consultorios:
    get:
      tags:
      - Dashboards e Informes
      summary: Análisis de uso de los consultorios
      description: Calcula qué consultorios físicos tuvieron mayor volumen de turnos (ocupación real) en un periodo dado.
      parameters:
      - name: fecha_desde
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: fecha_hasta
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: Métricas de utilización de infraestructura devueltas con éxito.
  /api/estadisticas/ausentismo:
    get:
      tags:
      - Dashboards e Informes
      summary: Ausentismo por médico y especialidad
      description: Devuelve `resumen` (total, atendidos, ausentes y cancelados) y los porcentajes de ausentes sobre turnos atendidos o ausentes agrupados por médico y por especialidad.
      parameters:
      - name: fecha_desde
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: fecha_hasta
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: Resumen y listados `medicos` y `especialidades` con `ausentes`, `considerados` y `porcentaje`.
  /api/estadisticas/tiempo_espera:
    get:
      tags:
      - Dashboards e Informes
      summary: Tiempo de espera por médico y especialidad
      description: Promedio de minutos entre el horario del turno y el registro de llegada, agrupado por médico y por especialidad. Sólo considera turnos con `fecha_horario_llegada`.
      parameters:
      - name: fecha_desde
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: fecha_hasta
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: Listados `medicos` y `especialidades` con `espera` y `turnos`, más `turnos_considerados`.
  /api/estadisticas/turnos-especialidad:
    get:
      tags:
      - Dashboards e Informes
      summary: Turnos agrupados por especialidad
      description: Devuelve `total_turnos` y un listado de especialidades con el detalle de sus turnos, listo para renderizar el dashboard.
      parameters:
      - name: fecha_desde
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: fecha_hasta
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: Agrupación de turnos por especialidad.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthResponse:
      required:
      - access_token
      - usuario
      type: object
      properties:
        access_token:
          type: string
          description: JWT firmado que el cliente enviará como Bearer en solicitudes protegidas.
        usuario:
          $ref: "#/components/schemas/UsuarioResumen"
    UsuarioResumen:
      required:
      - id_usuario
      - nombre
      - apellido
      - id_rol
      type: object
      properties:
        id_usuario:
          type: integer
          example: 45
        nombre:
          type: string
          example: Juan
        apellido:
          type: string
          example: Pérez
        id_rol:
          type: integer
          description: "1 = Admin, 2 = Recepción, 3 = Paciente, 4 = Médico"
          example: 3
      description: Datos mínimos del usuario devueltos por el login.
    LoginRequest:
      required:
      - correo_electronico
      - password
      type: object
      properties:
        correo_electronico:
          type: string
          format: email
          example: juan.perez@email.com
        password:
          type: string
          format: password
          example: secreta123
    UsuarioInfo:
      type: object
      properties:
        id_usuario:
          type: integer
          example: 45
        nombre:
          type: string
          example: Juan
        apellido:
          type: string
          example: Pérez
        id_rol:
          type: integer
          description: "1 = Admin, 2 = Recepción, 3 = Paciente, 4 = Médico"
          example: 3
        correo_electronico:
          type: string
          format: email
          example: juan.perez@example.com
        dni:
          type: string
          example: "30123456"
        fecha_nacimiento:
          type: string
          format: date
          example: "1990-05-12"
        fecha_creacion:
          type: string
          format: date-time
        paciente:
          type: object
          description: Presente solo cuando `id_rol = 3`.
          properties:
            id_paciente:
              type: integer
              example: 12
            id_cobertura:
              type: integer
              nullable: true
              example: 3
            nombre_cobertura:
              type: string
              nullable: true
              example: OSDE
            nro_afiliado:
              type: string
              nullable: true
              example: "123456"
        medico:
          type: object
          description: Presente solo cuando `id_rol = 4`.
          properties:
            id_medico:
              type: integer
              example: 5
            id_especialidad:
              type: integer
              example: 2
            nombre_especialidad:
              type: string
              example: Cardiología
            matricula:
              type: string
              example: "MP-1234"
      description: "Datos de la cuenta más el perfil específico del rol del usuario."
    PasswordUpdate:
      required:
      - nueva_password
      type: object
      additionalProperties: false
      properties:
        nueva_password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: ClaveNueva2026!
        password_actual:
          type: string
          format: password
          description: Obligatoria cuando el usuario cambia su propia contraseña.
    UsuarioUpdate:
      minProperties: 1
      type: object
      additionalProperties: false
      properties:
        nombre:
          type: string
          example: Juan
        apellido:
          type: string
          example: Pérez
        dni:
          type: string
          example: "30123456"
        correo_electronico:
          type: string
          format: email
          example: juan.perez@example.com
        fecha_nacimiento:
          type: string
          format: date
          example: "1990-05-12"
      description: Campos editables del perfil de una cuenta.
    NombreRequest:
      required:
      - nombre
      type: object
      properties:
        nombre:
          type: string
          example: Cardiología
      description: "Schema genérico para enviar nombres (especialidades, coberturas)."
    UsuarioStaffRegistro:
      required:
      - apellido
      - correo_electronico
      - dni
      - id_rol
      - nombre
      - password
      type: object
      properties:
        nombre:
          type: string
          example: Mariana
        apellido:
          type: string
          example: Gómez
        dni:
          type: string
          example: "25333444"
        correo_electronico:
          type: string
          format: email
          example: mgomez@clinica.com
        password:
          type: string
          format: password
          example: Segura99
        id_rol:
          type: integer
          description: "1=Admin, 2=Recepcionista"
          example: 2
        fecha_nacimiento:
          type: string
          format: date
          example: "1990-05-12"
      description: Estructura para registrar administrativos (no pacientes).
    PacienteRegistro:
      required:
      - apellido
      - correo_electronico
      - dni
      - fecha_nacimiento
      - nombre
      - password
      type: object
      properties:
        nombre:
          type: string
          example: Carlos
        apellido:
          type: string
          example: Rodríguez
        dni:
          type: string
          example: "30111222"
        correo_electronico:
          type: string
          format: email
          example: carlosr@email.com
        fecha_nacimiento:
          type: string
          format: date
          example: 1985-05-15
        password:
          type: string
          format: password
        id_cobertura:
          type: integer
          description: Nulo si es paciente particular (sin cobertura).
          nullable: true
          example: 12
      description: Estructura para registrar pacientes. El nro. de afiliado se genera automáticamente.
    PacienteUpdate:
      minProperties: 1
      type: object
      properties:
        nombre:
          type: string
        apellido:
          type: string
        dni:
          type: string
        correo_electronico:
          type: string
          format: email
        fecha_nacimiento:
          type: string
          format: date
        id_cobertura:
          type: integer
          nullable: true
      description: Permite actualizar datos del paciente. El nro. de afiliado se recalcula al cambiar la cobertura.
    ConsultorioRequest:
      required:
      - numero
      type: object
      properties:
        numero:
          type: integer
          minimum: 1
          example: 10
        piso:
          type: integer
          nullable: true
          example: 1
    MedicoRegistro:
      required:
      - apellido
      - correo_electronico
      - dni
      - id_especialidad
      - matricula
      - nombre
      - password
      type: object
      properties:
        nombre:
          type: string
          example: Dr. Roberto
        apellido:
          type: string
          example: López
        dni:
          type: string
          example: "15222333"
        correo_electronico:
          type: string
          format: email
          example: rlopez@clinica.com
        password:
          type: string
          format: password
        id_especialidad:
          type: integer
          example: 3
        matricula:
          type: string
          maxLength: 50
          example: MN-123456
      description: Creación de usuario y perfil médico en la misma transacción.
    MedicoUpdate:
      minProperties: 1
      type: object
      properties:
        id_especialidad:
          type: integer
          example: 4
        matricula:
          type: string
          maxLength: 50
          example: MN-123456
      description: Se puede actualizar la especialidad, la matrícula o ambos campos.
    AgendaConfig:
      required:
      - dias
      - duracion_turno
      - fecha_hasta
      - fecha_inicio
      - id_consultorio
      - id_medico
      type: object
      properties:
        id_medico:
          type: integer
          example: 5
        id_consultorio:
          type: integer
          example: 2
        duracion_turno:
          type: integer
          description: "Expresado en minutos (ej. 15, 30, 45)."
          example: 20
        fecha_inicio:
          type: string
          format: date
          example: 2026-11-01
        fecha_hasta:
          type: string
          format: date
          example: 2026-12-31
        dias:
          type: array
          description: Días de la semana en los que rige el horario.
          items:
            $ref: "#/components/schemas/AgendaConfig_dias"
      description: Modelo complejo para definir agendas y sus reglas de recurrencia en días semanales.
    AgendaUpdate:
      required:
      - fecha_hasta
      type: object
      properties:
        fecha_hasta:
          type: string
          format: date
          example: 2027-01-31
      description: Actualización limitada de fechas de agenda (las horas se tocan creando una nueva).
    TurnoEstadoUpdate:
      minProperties: 1
      type: object
      properties:
        id_estado:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: "ID de la tabla Estado (Ej. 4 = Atendido, 6 = Ausente)"
          example: 4
        estado:
          type: string
          enum:
          - atendido
          - ausente
          description: Alternativa a `id_estado` usando el nombre del estado.
      description: Cambio manual a atendido o ausente según el estado actual y la tolerancia de llegada.
    id_medico_coberturas_body:
      required:
      - id_cobertura
      type: object
      properties:
        id_cobertura:
          type: integer
    TurnosGenerarResponse:
      required:
      - mensaje
      - periodo
      - agendas_procesadas
      - turnos_generados
      - turnos_omitidos
      type: object
      properties:
        mensaje:
          type: string
          example: Turnos generados correctamente.
        periodo:
          type: object
          properties:
            fecha_desde:
              type: string
              format: date
            fecha_hasta:
              type: string
              format: date
        agendas_procesadas:
          type: integer
          example: 4
        turnos_generados:
          type: integer
          example: 120
        turnos_omitidos:
          type: integer
          example: 6
    turnos_checkin_body:
      required:
      - token
      type: object
      properties:
        token:
          type: string
          description: Cadena encriptada o UUID contenida en el código QR.
    id_turno_reservar_body:
      type: object
      properties:
        id_paciente:
          type: integer
          description: Obligatorio para administración y recepción. Los pacientes lo omiten porque se deduce del token.
    AgendaConfig_dias:
      required:
      - dia_semana
      - hora_fin
      - hora_inicio
      type: object
      properties:
        dia_semana:
          type: integer
          description: "Ej. 1 = Lunes, 2 = Martes"
          example: 1
        hora_inicio:
          type: string
          format: time
          example: 09:00:00
        hora_fin:
          type: string
          format: time
          example: 12:00:00
