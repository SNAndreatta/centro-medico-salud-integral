<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#E7EBEF">

    <title>Crear cuenta | Salud Integral</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-dominante font-sans text-acento antialiased">

    <main class="flex items-center justify-center px-4 py-4 sm:px-6 sm:py-10">

        <section class="w-1/2">

            <!-- Logo y nombre del centro -->
            <header class="mb-4 flex justify-center sm:mb-8">
                <div class="flex items-center gap-3">

                    <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-acento text-white">
                        <i data-lucide="activity" class="h-7 w-7 sm:h-8 sm:w-8"></i>
                    </div>

                    <div class="min-w-0">
                        <p class="mb-0.5 text-[10px] font-medium font-lexend tracking-[0.18em] text-slate-500 sm:text-xs">
                            CENTRO MÉDICO
                        </p>

                        <h2 class="font-gelasio text-2xl font-bold leading-tight tracking-tight">
                            Salud Integral
                        </h2>
                    </div>

                </div>
            </header>

            <!-- Tarjeta de registro -->
            <div class="rounded-xl bg-background px-5 py-6 shadow-sm sm:px-8">

                <div class="mb-4 text-center">
                    <h1 class="text-2xl font-bold font-lexend text-acento sm:text-[26px]">
                        Crear cuenta
                    </h1>
                </div>

                <form id="register-form"
                    method="POST"
                    action="{{ url_for('rutas_auth.register') }}"
                    novalidate
                    class="grid grid-cols-1 gap-5 sm:grid-cols-2">

                    <!-- Nombre -->
                    <div>
                        <label for="first-name"
                            class="mb-2 block text-sm font-semibold font-lexend text-slate-700">
                            Nombre
                        </label>

                        <div class="flex h-12 items-center gap-3 rounded-lg border border-slate-200 bg-white px-3.5 transition focus-within:border-acento focus-within:ring-2 focus-within:ring-acento/20">
                            <i data-lucide="user" class="h-[18px] w-[18px] shrink-0 text-slate-400"></i>
                            <input
                                id="first-name"
                                name="first_name"
                                type="text"
                                placeholder="Ingresá tu nombre"
                                autocomplete="given-name"
                                required
                                class="h-full min-w-0 flex-1 bg-transparent text-sm text-slate-700 outline-none placeholder:text-slate-400"
                            >
                        </div>
                    </div>

                    <!-- Apellido -->
                    <div>
                        <label for="last-name"
                            class="mb-2 block text-sm font-semibold font-lexend text-slate-700">
                            Apellido
                        </label>

                        <div class="flex h-12 items-center gap-3 rounded-lg border border-slate-200 bg-white px-3.5 transition focus-within:border-acento focus-within:ring-2 focus-within:ring-acento/20">
                            <i data-lucide="user" class="h-[18px] w-[18px] shrink-0 text-slate-400"></i>
                            <input
                                id="last-name"
                                name="last_name"
                                type="text"
                                placeholder="Ingresá tu apellido"
                                autocomplete="family-name"
                                required
                                class="h-full min-w-0 flex-1 bg-transparent text-sm text-slate-700 outline-none placeholder:text-slate-400"
                            >
                        </div>
                    </div>

                    <!-- Fecha de nacimiento -->
                    <div>
                        <label for="fecha_nacimiento"
                            class="mb-2 block text-sm font-semibold font-lexend text-slate-700">
                            Fecha de nacimiento
                        </label>

                        <div class="flex h-12 items-center gap-3 rounded-lg border border-slate-200 bg-white px-3.5 transition focus-within:border-acento focus-within:ring-2 focus-within:ring-acento/20">
                            <i data-lucide="calendar" class="h-[18px] w-[18px] shrink-0 text-slate-400"></i>
                            <input
                                id="fecha_nacimiento"
                                name="fecha_nacimiento"
                                type="date"
                                autocomplete="bday"
                                required
                                class="h-full min-w-0 flex-1 bg-transparent text-sm text-slate-700 outline-none"
                            >
                        </div>
                    </div>

                    <!-- DNI -->
                    <div>
                        <label for="dni"
                            class="mb-2 block text-sm font-semibold font-lexend text-slate-700">
                            DNI
                        </label>

                        <div class="flex h-12 items-center gap-3 rounded-lg border border-slate-200 bg-white px-3.5 transition focus-within:border-acento focus-within:ring-2 focus-within:ring-acento/20">
                            <i data-lucide="id-card" class="h-[18px] w-[18px] shrink-0 text-slate-400"></i>
                            <input
                                id="dni"
                                name="dni"
                                type="text"
                                inputmode="numeric"
                                placeholder="Ingresá tu DNI"
                                maxlength="8"
                                required
                                class="h-full min-w-0 flex-1 bg-transparent text-sm text-slate-700 outline-none placeholder:text-slate-400"
                            >
                        </div>
                    </div>

                    <!-- Correo electrónico (ancho completo) -->
                    <div class="sm:col-span-2">
                        <label for="email"
                            class="mb-2 block text-sm font-semibold font-lexend text-slate-700">
                            Correo electrónico
                        </label>

                        <div class="flex h-12 items-center gap-3 rounded-lg border border-slate-200 bg-white px-3.5 transition focus-within:border-acento focus-within:ring-2 focus-within:ring-acento/20">
                            <i data-lucide="mail" class="h-[18px] w-[18px] shrink-0 text-slate-400"></i>
                            <input
                                id="email"
                                name="email"
                                type="email"
                                placeholder="Ingresá tu correo"
                                autocomplete="email"
                                maxlength="150"
                                required
                                class="h-full min-w-0 flex-1 bg-transparent text-sm text-slate-700 outline-none placeholder:text-slate-400"
                            >
                        </div>
                    </div>

                    <!-- Contraseña -->
                    <div>
                        <label for="password"
                            class="mb-2 block text-sm font-semibold font-lexend text-slate-700">
                            Contraseña
                        </label>

                        <div class="flex h-12 items-center gap-3 rounded-lg border border-slate-200 bg-white px-3.5 transition focus-within:border-acento focus-within:ring-2 focus-within:ring-acento/20">
                            <i data-lucide="lock-keyhole" class="h-[18px] w-[18px] shrink-0 text-slate-400"></i>
                            <input
                                id="password"
                                name="password"
                                type="password"
                                placeholder="Creá una contraseña"
                                autocomplete="new-password"
                                minlength="8"
                                maxlength="256"
                                required
                                class="h-full min-w-0 flex-1 bg-transparent text-sm text-slate-700 outline-none placeholder:text-slate-400"
                            >
                            <button
                                type="button"
                                class="toggle-password flex h-9 w-9 shrink-0 items-center justify-center rounded-md text-slate-400 transition hover:bg-slate-100 hover:text-acento focus:outline-none focus:ring-2 focus:ring-acento/30"
                                data-target="password"
                                aria-label="Mostrar contraseña"
                                aria-pressed="false"
                            >
                                <i data-lucide="eye" class="h-[18px] w-[18px]"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Confirmar contraseña -->
                    <div>
                        <label for="confirm-password"
                            class="mb-2 block text-sm font-semibold font-lexend text-slate-700">
                            Confirmar contraseña
                        </label>

                        <div class="flex h-12 items-center gap-3 rounded-lg border border-slate-200 bg-white px-3.5 transition focus-within:border-acento focus-within:ring-2 focus-within:ring-acento/20">
                            <i data-lucide="lock-keyhole" class="h-[18px] w-[18px] shrink-0 text-slate-400"></i>
                            <input
                                id="confirm-password"
                                name="confirm_password"
                                type="password"
                                placeholder="Repetí tu contraseña"
                                autocomplete="new-password"
                                minlength="8"
                                maxlength="256"
                                required
                                class="h-full min-w-0 flex-1 bg-transparent text-sm text-slate-700 outline-none placeholder:text-slate-400"
                            >
                            <button
                                type="button"
                                class="toggle-password flex h-9 w-9 shrink-0 items-center justify-center rounded-md text-slate-400 transition hover:bg-slate-100 hover:text-acento focus:outline-none focus:ring-2 focus:ring-acento/30"
                                data-target="confirm-password"
                                aria-label="Mostrar contraseña"
                                aria-pressed="false"
                            >
                                <i data-lucide="eye" class="h-[18px] w-[18px]"></i>
                            </button>
                        </div>
                    </div>

                    <p class="-mt-2 text-xs font-lexend text-slate-400 sm:col-span-2">
                        La contraseña debe tener al menos 8 caracteres.
                    </p>

                    <!-- Mensaje del formulario -->
                    {% if mensaje %}
                        <p id="register-message"
                           role="alert"
                           class="rounded-lg bg-red-50 p-3 text-sm text-red-700 sm:col-span-2">
                            {{ mensaje }}
                        </p>
                    {% else %}
                        <p id="register-message"
                           role="alert"
                           class="hidden rounded-lg bg-red-50 p-3 text-sm text-red-700 sm:col-span-2"></p>
                    {% endif %}

                    <!-- Botón de registro -->
                    <button
                        type="submit"
                        class="flex h-12 w-full items-center justify-center gap-2 rounded-lg bg-acento px-4 text-sm font-semibold font-lexend text-white transition hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-acento focus:ring-offset-2 sm:col-span-2"
                    >
                        Crear cuenta
                        <i data-lucide="arrow-right" class="h-[18px] w-[18px]"></i>
                    </button>

                </form>

                <!-- Inicio de sesión -->
                <p class="text-center text-sm leading-relaxed font-lexend text-slate-600 mt-4">
                    ¿Ya tenés una cuenta?
                    <a
                        href="{{ url_for('rutas_auth.login') }}"
                        class="font-semibold font-lexend text-acento underline-offset-4 hover:underline"
                    >
                        Iniciá sesión
                    </a>
                </p>

            </div>

        </section>
    </main>

    <script src="{{ url_for('static', filename='js/auth/register.js') }}"></script>

</body>
</html>
