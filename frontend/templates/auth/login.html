<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#E7EBEF">

    <title>Iniciar sesión | Salud Integral</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-dominante font-sans text-acento antialiased">

    <main class="flex items-center justify-center px-4 py-4 sm:px-6 sm:py-10">

        <section class="w-full max-w-[400px]">

            <!-- Logo y nombre del centro -->
            <header class="mb-4 flex justify-center sm:mb-8">
                <div class="flex items-center gap-2.5 sm:gap-3">

                    <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl bg-acento text-white sm:h-12 sm:w-12">
                        <i data-lucide="activity" class="h-6 w-6 sm:h-8 sm:w-8"></i>
                    </div>

                    <div class="min-w-0">
                        <p class="mb-0.5 text-[9px] font-medium font-lexend tracking-[0.18em] text-slate-500 sm:text-xs">
                            CENTRO MÉDICO
                        </p>

                        <h2 class="font-gelasio text-xl font-bold leading-tight tracking-tight sm:text-2xl">
                            Salud Integral
                        </h2>
                    </div>

                </div>
            </header>

            <!-- Tarjeta de inicio de sesión -->
            <div class="rounded-xl bg-white px-4 py-6 shadow-sm sm:px-8 sm:py-9">

                <div class="mb-4 text-center">
                    <h1 class="text-xl font-bold font-lexend text-acento sm:text-[26px]">
                        Iniciar sesión
                    </h1>
                </div>

                <form id="login-form"
                    method="POST"
                    action="{{ url_for('rutas_auth.login') }}"
                    class="space-y-4 sm:space-y-5">

                    <div>
                        <label
                            for="email"
                            class="mb-2 block text-xs font-semibold font-lexend text-slate-700 sm:text-sm">
                                Correo electrónico
                        </label>

                        <div class="flex h-11 items-center gap-2.5 rounded-2xl border border-slate-200 bg-white px-3 transition focus-within:border-acento focus-within:ring-2 focus-within:ring-acento/20 sm:h-12 sm:gap-3 sm:px-3.5">

                            <i
                                data-lucide="mail"
                                class="h-4 w-4 shrink-0 text-slate-400 sm:h-[18px] sm:w-[18px]"
                            ></i>

                            <input
                                id="email"
                                name="email"
                                type="email"
                                placeholder="Ingresá tu correo"
                                autocomplete="email"
                                required
                                class="h-full min-w-0 flex-1 bg-transparent text-xs text-slate-700 outline-none placeholder:text-slate-400 sm:text-sm"
                            >
                        </div>
                    </div>

                    <!-- Contraseña -->
                    <div>
                        <label
                            for="password"
                            class="mb-2 block text-xs font-semibold text-slate-700 sm:text-sm"
                        >
                            Contraseña
                        </label>

                        <div class="flex h-11 items-center gap-2.5 rounded-2xl border border-slate-200 bg-white px-3 transition focus-within:border-acento focus-within:ring-2 focus-within:ring-acento/20 sm:h-12 sm:gap-3 sm:px-3.5">

                            <i
                                data-lucide="lock-keyhole"
                                class="h-4 w-4 shrink-0 text-slate-400 sm:h-[18px] sm:w-[18px]"
                            ></i>

                            <input
                                id="password"
                                name="password"
                                type="password"
                                placeholder="Ingresá tu contraseña"
                                autocomplete="current-password"
                                required
                                class="h-full min-w-0 flex-1 bg-transparent text-xs text-slate-700 outline-none placeholder:text-slate-400 sm:text-sm"
                            >

                            <button
                                type="button"
                                id="toggle-password"
                                aria-label="Mostrar contraseña"
                                aria-pressed="false"
                                class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md text-slate-400 transition hover:bg-slate-100 hover:text-acento focus:outline-none focus:ring-2 focus:ring-acento/30 sm:h-9 sm:w-9"
                            >
                                <i data-lucide="eye" class="h-4 w-4 sm:h-[18px] sm:w-[18px]"></i>
                            </button>

                        </div>
                    </div>

                    <!-- Mensaje del formulario -->
                    {% if mensaje %}
                        <p role="alert"
                        class="rounded-2xl bg-dominante p-2.5 text-xs text-acento sm:p-3 sm:text-sm">
                            {{ mensaje }}
                        </p>
                    {% endif %}

                    <!-- Botón de acceso -->
                    <button
                        type="submit"
                        class="flex h-11 w-full items-center justify-center gap-2 rounded-2xl bg-acento px-3 text-xs font-semibold font-lexend text-white transition hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-acento focus:ring-offset-2 sm:h-12 sm:px-4 sm:text-sm"
                    >
                        Iniciar sesión
                        <i data-lucide="arrow-right" class="h-4 w-4 sm:h-[18px] sm:w-[18px]"></i>
                    </button>

                </form>

                <!-- Registro -->
                <p class="text-center text-xs leading-relaxed font-lexend text-slate-600 mt-4 sm:text-sm">
                    ¿No tenés una cuenta?
                    <a
                        href="{{ url_for('rutas_auth.register') }}"
                        class="font-semibold font-lexend text-acento underline-offset-4 hover:underline"
                    >
                        Registrate
                    </a>
                </p>

            </div>

           

        </section>
    </main>
    <script src="{{ url_for('static', filename='js/auth/login.js') }}"></script>

</body>
</html>
