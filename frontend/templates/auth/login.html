<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#E7EBEF">

    <title>Iniciar sesión | Salud Integral</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-dominante font-sans text-acento antialiased">

    <main class="flex items-center justify-center px-4 py-8 sm:px-6 sm:py-10">

        <section class="w-full max-w-[400px]">

            <!-- Logo y nombre del centro -->
            <header class="mb-7 flex justify-center sm:mb-8">
                <div class="flex items-center gap-3">

                    <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-acento text-white sm:h-16 sm:w-16">
                        <i data-lucide="activity" class="h-9 w-9 sm:h-10 sm:w-10"></i>
                    </div>

                    <div class="min-w-0">
                        <p class="mb-0.5 text-[10px] font-medium font-lexend tracking-[0.18em] text-slate-500 sm:text-xs">
                            CENTRO MÉDICO
                        </p>

                        <h2 class="font-gelasio text-4xl font-bold leading-tight tracking-tight sm:text-3xl">
                            Salud Integral
                        </h2>
                    </div>

                </div>
            </header>

            <!-- Tarjeta de inicio de sesión -->
            <div class="rounded-xl bg-background px-5 py-7 shadow-sm sm:px-8 sm:py-9">

                <div class="mb-7 text-center">
                    <h1 class="text-2xl font-bold font-lexend text-acento sm:text-[26px]">
                        Iniciar sesión
                    </h1>
                </div>

                <form id="login-form"
                    method="POST"
                    action="{{ url_for('rutas_auth.login') }}"
                    class="space-y-5">

                    <div>
                        <label
                            for="email"
                            class="mb-2 block text-sm font-semibold font-lexend text-slate-700">
                                Correo electrónico
                        </label>

                        <div class="flex h-12 items-center gap-3 rounded-lg border border-slate-200 bg-white px-3.5 transition focus-within:border-acento focus-within:ring-2 focus-within:ring-acento/20">

                            <i
                                data-lucide="mail"
                                class="h-[18px] w-[18px] shrink-0 text-slate-400"
                            ></i>

                            <input
                                id="email"
                                name="email"
                                type="email"
                                placeholder="Ingresá tu correo"
                                autocomplete="email"
                                required
                                class="h-full min-w-0 flex-1 bg-transparent text-sm text-slate-700 outline-none placeholder:text-slate-400"
                            >
                        </div>
                    </div>

                    <!-- Contraseña -->
                    <div>
                        <label
                            for="password"
                            class="mb-2 block text-sm font-semibold text-slate-700"
                        >
                            Contraseña
                        </label>

                        <div class="flex h-12 items-center gap-3 rounded-lg border border-slate-200 bg-white px-3.5 transition focus-within:border-acento focus-within:ring-2 focus-within:ring-acento/20">

                            <i
                                data-lucide="lock-keyhole"
                                class="h-[18px] w-[18px] shrink-0 text-slate-400"
                            ></i>

                            <input
                                id="password"
                                name="password"
                                type="password"
                                placeholder="Ingresá tu contraseña"
                                autocomplete="current-password"
                                required
                                class="h-full min-w-0 flex-1 bg-transparent text-sm text-slate-700 outline-none placeholder:text-slate-400"
                            >

                            <button
                                type="button"
                                id="toggle-password"
                                aria-label="Mostrar contraseña"
                                aria-pressed="false"
                                class="flex h-9 w-9 shrink-0 items-center justify-center rounded-md text-slate-400 transition hover:bg-slate-100 hover:text-acento focus:outline-none focus:ring-2 focus:ring-acento/30"
                            >
                                <i data-lucide="eye" class="h-[18px] w-[18px]"></i>
                            </button>

                        </div>

                        <div class="mt-2.5 text-right">
                            <a
                                href="#recuperar"
                                class="text-xs font-medium font-lexend text-acento underline-offset-4 hover:underline"
                            >
                                ¿Olvidaste tu contraseña?
                            </a>
                        </div>
                    </div>

                    <!-- Mensaje del formulario -->
                    {% if mensaje %}
                        <p role="alert"
                        class="rounded-lg bg-dominante p-3 text-sm text-acento">
                            {{ mensaje }}
                        </p>
                    {% endif %}

                    <!-- Botón de acceso -->
                    <button
                        type="submit"
                        class="flex h-12 w-full items-center justify-center gap-2 rounded-lg bg-acento px-4 text-sm font-semibold font-lexend text-white transition hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-acento focus:ring-offset-2"
                    >
                        Iniciar sesión
                        <i data-lucide="arrow-right" class="h-[18px] w-[18px]"></i>
                    </button>

                </form>

                <!-- Separador -->
                <div class="my-6 flex items-center gap-3">
                    <div class="h-px flex-1 bg-slate-200"></div>
                    <span class="text-xs text-slate-400">O</span>
                    <div class="h-px flex-1 bg-slate-200"></div>
                </div>

                <!-- Registro -->
                <p class="text-center text-sm leading-relaxed font-lexend text-slate-600">
                    ¿No tenés una cuenta?
                    <a
                        href="{{ url_for('rutas_auth.register') }}"
                        class="font-semibold font-lexend text-acento underline-offset-4 hover:underline"
                    >
                        Registrate
                    </a>
                </p>

            </div>

           

        </section>
    </main>
    <script src="{{ url_for('static', filename='js/auth/login.js') }}"></script>

</body>
</html>
