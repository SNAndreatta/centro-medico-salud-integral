<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#E7EBEF">

    <title>Inicio | Recepción - Salud Integral</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">

    <!-- Tipografía Gelasio -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tipografía Lexend -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">

    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="min-h-screen bg-dominante font-sans text-acento antialiased">

    <main class="min-h-screen px-4 py-6 sm:px-8 sm:py-8 lg:px-12">

        <section class="mx-auto w-full max-w-6xl">

            <!-- Encabezado -->
            <header class="mb-7 flex items-center justify-between">

                <!-- Logo y nombre del centro -->
                <div class="flex items-center gap-2.5 sm:gap-3">

                    <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-md bg-acento text-white sm:h-12 sm:w-12">
                        <i data-lucide="activity" class="h-7 w-7 sm:h-8 sm:w-8"></i>
                    </div>

                    <div class="min-w-0">
                        <p class="mb-0.5 text-[8px] font-medium font-lexend tracking-[0.18em] text-slate-500 sm:text-[10px]">
                            CENTRO MÉDICO DE
                        </p>

                        <h1 class="font-gelasio text-xl font-bold leading-tight tracking-tight sm:text-3xl">
                            Salud Integral
                        </h1>
                    </div>

                </div>

                <!-- Perfil -->
                <a
                    href="#"
                    aria-label="Mi perfil"
                    class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full text-acento transition hover:bg-white/60 focus:outline-none focus:ring-2 focus:ring-acento/30 sm:h-12 sm:w-12"
                >
                    <i data-lucide="circle-user-round" class="h-9 w-9 sm:h-10 sm:w-10"></i>
                </a>

            </header>

            <!-- Información del usuario -->
            <div class="mb-7 flex min-h-12 items-center justify-between gap-3 rounded-2xl bg-acento px-5 py-3 text-white sm:px-7">

                <p class="min-w-0 truncate text-sm font-semibold font-lexend sm:text-lg">
                    {{ nombre_completo | default('Nombre Completo') }}
                </p>

                <span class="shrink-0 text-sm font-semibold font-lexend sm:text-lg">
                    Recepción
                </span>

            </div>

            <!-- Opciones principales -->
            <nav aria-label="Menú principal de recepción" class="space-y-5 sm:space-y-6">

                <!-- Ver sala de espera -->
                <a
                    href="#"
                    class="group flex min-h-[76px] items-center justify-between gap-4 rounded-2xl bg-background px-5 py-5 transition hover:bg-white hover:shadow-md focus:outline-none focus:ring-2 focus:ring-acento/30 sm:min-h-[84px] sm:px-7"
                >

                    <span class="text-base font-bold font-lexend tracking-wide text-acento sm:text-xl lg:text-2xl">
                        VER SALA DE ESPERA
                    </span>

                    <i
                        data-lucide="users-round"
                        class="h-8 w-8 shrink-0 text-acento transition group-hover:scale-110 sm:h-10 sm:w-10"
                    ></i>

                </a>

                <!-- Ver pacientes -->
                <a
                    href="#"
                    class="group flex min-h-[76px] items-center justify-between gap-4 rounded-2xl bg-background px-5 py-5 transition hover:bg-white hover:shadow-md focus:outline-none focus:ring-2 focus:ring-acento/30 sm:min-h-[84px] sm:px-7"
                >

                    <span class="text-base font-bold font-lexend tracking-wide text-acento sm:text-xl lg:text-2xl">
                        VER PACIENTES
                    </span>

                    <i
                        data-lucide="calendar-days"
                        class="h-8 w-8 shrink-0 text-acento transition group-hover:scale-110 sm:h-10 sm:w-10"
                    ></i>

                </a>

                <!-- Ver turnos -->
                <a
                    href="#"
                    class="group flex min-h-[76px] items-center justify-between gap-4 rounded-2xl bg-background px-5 py-5 transition hover:bg-white hover:shadow-md focus:outline-none focus:ring-2 focus:ring-acento/30 sm:min-h-[84px] sm:px-7"
                >

                    <span class="text-base font-bold font-lexend tracking-wide text-acento sm:text-xl lg:text-2xl">
                        VER TURNOS
                    </span>

                    <i
                        data-lucide="calendar-clock"
                        class="h-8 w-8 shrink-0 text-acento transition group-hover:scale-110 sm:h-10 sm:w-10"
                    ></i>

                </a>

            </nav>

        </section>

    </main>

    <script>
        lucide.createIcons();
    </script>

</body>
</html>
