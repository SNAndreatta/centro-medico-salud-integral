<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#E7EBEF">

    <title>Sala de espera | Salud Integral</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">

    <!-- Tipografía Gelasio -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tipografía Lexend -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">

    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="min-h-screen bg-dominante font-sans text-acento antialiased">

    <main class="min-h-screen px-4 py-6 sm:px-8 sm:py-8 lg:px-12">

        <section class="mx-auto w-full max-w-6xl">

            <!-- Encabezado -->
            <header class="mb-7 flex items-center justify-between">

                <!-- Logo -->
                <a href="#" class="flex items-center gap-2.5 sm:gap-3">

                    <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-md bg-acento text-white sm:h-12 sm:w-12">
                        <i data-lucide="activity" class="h-7 w-7 sm:h-8 sm:w-8"></i>
                    </div>

                    <div class="min-w-0">
                        <p class="mb-0.5 text-[8px] font-medium font-lexend tracking-[0.18em] text-slate-500 sm:text-[10px]">
                            CENTRO MÉDICO DE
                        </p>

                        <h1 class="font-gelasio text-xl font-bold leading-tight tracking-tight sm:text-3xl">
                            Salud Integral
                        </h1>
                    </div>

                </a>

                <!-- Perfil -->
                <a
                    href="#"
                    aria-label="Mi perfil"
                    class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full text-acento transition hover:bg-white/60 focus:outline-none focus:ring-2 focus:ring-acento/30 sm:h-12 sm:w-12"
                >
                    <i data-lucide="circle-user-round" class="h-9 w-9 sm:h-10 sm:w-10"></i>
                </a>

            </header>

            <!-- Título y botón de ingreso -->
            <div class="mb-4 flex flex-wrap items-center justify-between gap-3 border-b border-slate-400/70 px-1 pb-1">

                <h2 class="text-lg font-bold font-lexend tracking-wide text-acento sm:text-2xl">
                    SALA DE ESPERA
                </h2>

                <a
                    href="#"
                    class="flex items-center gap-2 rounded-full bg-[#60849A] px-3 py-1.5 text-xs font-medium font-lexend text-white transition hover:bg-acento sm:text-sm"
                >
                    Ingresar paciente
                    <i data-lucide="qr-code" class="h-5 w-5"></i>
                </a>

            </div>

            <!-- Listado de pacientes -->
            <section aria-label="Pacientes en espera" class="space-y-3.5 sm:space-y-4">

                {% for paciente in pacientes_en_espera %}

                    {% include "recepcion/_card_paciente.html" %}

                {% else %}

                    <!-- Estado sin pacientes -->
                    <div class="flex flex-col items-center justify-center rounded-2xl bg-background px-5 py-12 text-center">

                        <i data-lucide="users-round" class="mb-4 h-12 w-12 text-slate-400"></i>

                        <h3 class="font-gelasio text-xl font-semibold text-acento sm:text-2xl">
                            Sala de espera vacía
                        </h3>

                        <p class="mt-2 text-sm font-lexend text-slate-500">
                            Todavía no hay pacientes esperando atención.
                        </p>

                    </div>

                {% endfor %}

            </section>

        </section>

    </main>

    <script>
        lucide.createIcons();
    </script>

</body>
</html>
