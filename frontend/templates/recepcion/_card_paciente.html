<article class="flex flex-col gap-4 rounded-2xl bg-white px-5 py-4 transition hover:shadow-md sm:flex-row sm:items-center sm:gap-5 sm:px-7">

    <!-- Iniciales y nombre -->
    <div class="flex min-w-0 flex-1 items-center gap-4">

        <!-- Avatar -->
        <div
            class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full font-lexend text-xl font-medium {{ paciente.color_avatar | default('bg-pink-100 text-pink-500') }}">
            {{ paciente.iniciales | default('NC') }}
        </div>

        <!-- Nombre completo -->
        <h3 class="min-w-0 truncate font-gelasio text-xl font-medium text-acento sm:text-2xl lg:text-[26px]">
            {{ paciente.nombre_completo }}
        </h3>

    </div>

    <!-- Horarios -->
    <div class="grid grid-cols-2 gap-3 sm:flex sm:flex-1 sm:items-center sm:justify-between sm:gap-4">

        <!-- Hora del turno -->
        <div class="flex flex-col gap-0.5 sm:flex-row sm:items-center sm:gap-2">

            <span class="text-[10px] font-medium font-lexend tracking-wide text-[#60849A] sm:text-xs">
                HORA TURNO
            </span>

            <span class="text-xs font-semibold font-lexend text-acento sm:text-sm">
                {{ paciente.hora_turno }}
            </span>

        </div>

        <!-- Hora de llegada -->
        <div class="flex flex-col gap-0.5 sm:flex-row sm:items-center sm:gap-2">

            <span class="text-[10px] font-medium font-lexend tracking-wide text-[#60849A] sm:text-xs">
                HORA LLEGADA
            </span>

            <span class="text-xs font-semibold font-lexend text-acento sm:text-sm">
                {{ paciente.hora_llegada }}
            </span>

        </div>

    </div>

    <!-- Modalidad -->
    <div class="flex items-center justify-start sm:w-24 sm:justify-center">

        <span class="font-lexend text-xl font-medium tracking-wide text-[#60849A] sm:text-2xl lg:text-[26px]">
            {{ paciente.modalidad }}
        </span>

    </div>

</article>
