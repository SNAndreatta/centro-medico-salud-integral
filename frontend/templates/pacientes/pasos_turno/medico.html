{% extends "/pacientes/pasos_turno/sacar_turno.html" %}

{% set paso = 2 %}

{% block contenido_paso %}

<div class="space-y-5">

    <h2 class="font-lexend text-base font-semibold text-acento">
        Elegí tu médico de confianza
    </h2>

    <form method="POST" action="#fecha">

        <div class="space-y-2">

            {% for medico in medicos %}

            <label class="flex cursor-pointer items-center justify-between gap-3 rounded-lg border border-gray-200 px-3 py-2 transition hover:border-acento hover:bg-[#F5F8FA]">

                <div class="flex min-w-0 items-center gap-3">

                    <!-- Iniciales del médico -->
                    <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-[#F8DCE3] text-xs font-semibold text-[#D77F91]">
                        {{ medico.iniciales }}
                    </div>

                    <!-- Información -->
                    <div class="min-w-0">

                        <p class="truncate text-sm font-semibold text-[#66869F]">
                            Dr. {{ medico.nombre }}
                        </p>

                        <p class="truncate text-[10px] text-[#66869F]">
                            {% if medico.acepta_cobertura %}
                                Atiende tu cobertura
                            {% else %}
                                No atiende tu cobertura
                            {% endif %}
                        </p>

                    </div>

                </div>

                <!-- Selector -->
                <input
                    type="radio"
                    name="medico_id"
                    value="{{ medico.id }}"
                    required
                    class="h-4 w-4 shrink-0 accent-[#66869F]"
                    {% if medico_seleccionado is defined and medico_seleccionado == medico.id %}
                        checked
                    {% endif %}
                >

            </label>

            {% else %}

            <div class="rounded-lg border border-gray-200 px-4 py-8 text-center">
                <p class="text-sm text-[#66869F]">
                    No hay médicos disponibles para esta especialidad.
                </p>
            </div>

            {% endfor %}

        </div>

        <!-- Continuar -->
        <div class="mt-5 flex justify-end">

            <button
                type="submit"
                class="inline-flex items-center gap-2 rounded-full bg-acento px-5 py-2 text-xs font-medium text-white transition hover:opacity-90"
            >
                Continuar
                <i data-lucide="arrow-right" class="h-4 w-4"></i>
            </button>

        </div>

    </form>

</div>

{% endblock %}
