
{% extends "pacientes/pasos_turno/sacar_turno.html" %}

{% set paso = 2 %}

{% block contenido_paso %}

<div class="space-y-5">

    <h2 class="font-lexend text-base font-semibold text-acento">
        Elegí tu médico de confianza
    </h2>

    <form method="POST">

        <input type="hidden" name="paso" value="2">

        <div class="space-y-2">

            {% for medico in medicos %}

            <label class="flex cursor-pointer items-center justify-between gap-3 rounded-lg border border-gray-200 px-3 py-2 transition hover:border-acento hover:bg-acento/5">

                <div class="flex min-w-0 items-center gap-3">

                    <!-- Iniciales del médico -->
                    <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-pink-500/30 text-xs font-semibold text-pink-500">
                        {{ medico.iniciales }}
                    </div>

                    <!-- Información -->
                    <div class="min-w-0">

                        <p class="truncate text-sm font-semibold text-acento/70">
                            Dr. {{ medico.nombre }}
                        </p>

                        <p class="truncate text-[10px] text-acento/70">
                            {% if medico.acepta_cobertura %}
                                Atiende tu cobertura
                            {% else %}
                                No atiende tu cobertura
                            {% endif %}
                        </p>

                    </div>

                </div>

                <!-- Selector -->
                <input
                    type="radio"
                    name="medico_id"
                    value="{{ medico.id }}"
                    required
                    class="h-4 w-4 shrink-0 accent-acento/70"
                    {% if medico_seleccionado is defined and medico_seleccionado == medico.id %}
                        checked
                    {% endif %}
                >

            </label>

            {% else %}

            <div class="rounded-lg border border-gray-200 px-4 py-8 text-center">
                <p class="text-sm text-acento/70">
                    No hay médicos disponibles para esta especialidad.
                </p>
            </div>

            {% endfor %}

        </div>

        <!-- Botones anterior y siguiente -->
        <div class="mt-6 flex w-full flex-row flex-wrap items-center justify-between gap-2">

            <!-- Anterior -->
            <button
                type="submit"
                name="accion"
                value="anterior"
                formnovalidate
                class="inline-flex items-center gap-2 rounded-full border border-acento px-3 py-2 text-xs font-medium text-acento transition hover:bg-acento/5 sm:px-5"
            >
                <i data-lucide="arrow-left" class="h-4 w-4"></i>
                Anterior
            </button>

            <!-- Siguiente -->
            <button
                type="submit"
                class="inline-flex items-center gap-2 rounded-full bg-acento px-3 py-2 text-xs font-medium text-white transition hover:opacity-90 sm:px-5"
            >
                Siguiente
                <i data-lucide="arrow-right" class="h-4 w-4"></i>
            </button>

        </div>

    </form>

</div>

{% endblock %}
