{% extends "base.html" %}

{% block title %}Agenda | Salud Integral{% endblock %}

{% block content %}

<div class="px-1 sm:px-2">

    <!-- Encabezado -->
    <div class="mb-2 flex flex-wrap items-center justify-between gap-3 border-b border-acento/20 pb-2">

        <h2 class="text-xl font-bold tracking-wide text-acento">
            AGENDA DE {{ medico.nombre_completo | default('Dr. Nombre Completo') }}
        </h2>

        <a
            href="{{ url_for('rutas_admin_medico.medico_perfil', id_medico=medico.id) }}"
            class="flex items-center gap-1 rounded-full bg-acento/70 px-4 py-2 text-xs font-semibold text-white transition hover:bg-acento"
        >
            Ir al perfil
            <i data-lucide="chevron-right" class="h-4 w-4"></i>
        </a>

    </div>

    {% include "components/agenda_mensual.html" %}

</div>

{% endblock %}


{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/agenda_mensual.js') }}" defer></script>
{% endblock %}
