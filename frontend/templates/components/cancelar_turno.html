<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#E7EBEF">

    <title>{{ titulo }} | Salud Integral</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;500;600;700&family=Lexend:wght@100..900&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-dominante font-sans text-acento antialiased">

    <main class="flex items-center justify-center px-4 py-4 sm:px-6 sm:py-10">

        <section class="w-full min-w-0 max-w-[400px]">

            <!-- Logo y nombre del centro -->
            <header class="mb-4 flex justify-center sm:mb-8">
                <div class="flex min-w-0 items-center gap-2.5 sm:gap-3">

                    <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl bg-acento text-white sm:h-12 sm:w-12">
                        <i data-lucide="activity" class="h-6 w-6 sm:h-8 sm:w-8"></i>
                    </div>

                    <div class="min-w-0">
                        <p class="mb-0.5 text-[9px] font-medium font-lexend tracking-[0.18em] text-slate-500 sm:text-xs">
                            CENTRO MÉDICO
                        </p>
                        <h2 class="font-gelasio text-xl font-bold leading-tight tracking-tight sm:text-2xl">
                            Salud Integral
                        </h2>
                    </div>

                </div>
            </header>

            <!-- Tarjeta de resultado -->
            <div class="rounded-xl bg-white px-4 py-6 text-center shadow-sm sm:px-8 sm:py-9">
                <h1 class="mb-3 break-words text-xl font-bold font-lexend leading-snug text-acento sm:text-[26px]">
                    {{ titulo }}
                </h1>

                <p class="mb-6 break-words text-xs leading-relaxed font-lexend text-slate-600 sm:text-sm">
                    {{ mensaje }}
                </p>

                <a
                    href="{{ boton_url }}"
                    class="flex h-11 w-full items-center justify-center gap-2 rounded-2xl bg-acento px-3 text-xs font-semibold font-lexend text-white transition hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-acento focus:ring-offset-2 sm:h-12 sm:px-4 sm:text-sm"
                >
                    {{ boton_texto }}
                    <i data-lucide="arrow-right" class="h-4 w-4 shrink-0 sm:h-[18px] sm:w-[18px]"></i>
                </a>

            </div>

        </section>
    </main>

    <script>lucide.createIcons();</script>

</body>
</html>
