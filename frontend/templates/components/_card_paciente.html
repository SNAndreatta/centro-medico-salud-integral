<article class="rounded-2xl bg-white px-4 py-3 transition hover:shadow-md sm:px-7 sm:py-4">

    <!-- Fila principal: en celular los horarios bajan solos (flex-wrap + order) -->
    <div class="flex flex-wrap items-center gap-3 sm:flex-nowrap sm:gap-5">

        <!-- Avatar y nombre -->
        <div class="order-1 flex min-w-0 flex-1 items-center gap-3 sm:gap-4">

            <!-- Avatar -->
            <div
                class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full font-lexend text-sm font-medium sm:h-14 sm:w-14 sm:text-xl {{ paciente.color_avatar | default('bg-pink-100 text-pink-500') }}">
                {{ paciente.iniciales }}
            </div>

            <!-- Nombre completo (sin cortar: si es largo baja de renglón) -->
            <h3 class="min-w-0 break-words font-gelasio text-lg font-medium leading-tight text-acento sm:text-2xl lg:text-[26px]">
                {{ paciente.nombre_completo }}
            </h3>

        </div>

        <!-- Tres letras + número de consultorio (celular: apilados / tablet y web: lado a lado) -->
        <div class="order-2 flex shrink-0 flex-col items-center justify-center gap-0.5 sm:order-3 sm:flex-row sm:gap-4">

            <span class="font-lexend text-base font-medium tracking-wide text-acento/80 sm:text-2xl lg:text-[26px]">
                {{ paciente.modalidad }}
            </span>

            {% if paciente.consultorio %}
            <span class="font-lexend text-base font-medium tracking-wide text-acento/80 sm:text-2xl lg:text-[26px]">
                {{ paciente.consultorio }}
            </span>
            {% endif %}

        </div>

        <!-- Horarios (en celular bajan a su propio renglón) -->
        <div class="order-3 grid w-full grid-cols-2 gap-3 sm:order-2 sm:flex sm:w-auto sm:flex-1 sm:items-center sm:justify-start sm:gap-4">

            <!-- Hora del turno -->
            <div class="flex flex-col gap-0.5 sm:flex-row sm:items-center sm:gap-2">

                <span class="text-[10px] font-medium font-lexend tracking-wide text-acento/80 sm:text-xs">
                    HORA TURNO
                </span>

                <span class="text-xs font-semibold font-lexend text-acento sm:text-sm">
                    {{ paciente.hora_turno }}
                </span>

            </div>

            <!-- Hora de llegada -->
            <div class="flex flex-col gap-0.5 sm:flex-row sm:items-center sm:gap-2">

                <span class="text-[10px] font-medium font-lexend tracking-wide text-acento/80 sm:text-xs">
                    HORA LLEGADA
                </span>

                <span class="text-xs font-semibold font-lexend text-acento sm:text-sm">
                    {{ paciente.hora_llegada }}
                </span>

            </div>

        </div>

    </div>

</article>
