

<div class="flex flex-col gap-5 sm:gap-7">


   <!-- TARJETA DE PERFIL -->
   <section class="relative overflow-hidden rounded-[20px] bg-white">


       <!-- ENCABEZADO AZUL -->
       <div class="relative flex min-h-[5.5rem] items-end bg-acento px-3 pb-3 pt-3 sm:h-32 sm:min-h-0 sm:px-8 sm:pb-3">


           <!-- NOMBRE -->
           <div class="min-w-0 w-full pl-[4.5rem] sm:pl-28">
               <h1 class="break-words font-gelasio text-sm font-semibold leading-tight text-white min-[380px]:text-base min-[450px]:text-lg sm:text-3xl">
                   {{ usuario.nombre }} {{ usuario.apellido }}
               </h1>
           </div>


           <!-- AVATAR CENTRADO ENTRE AZUL Y BLANCO -->
           <div class="absolute bottom-0 left-3 z-10 flex h-14 w-14 translate-y-1/2 items-center justify-center rounded-full border-4 border-white bg-acento font-lexend text-sm font-semibold text-white sm:left-8 sm:h-24 sm:w-24 sm:border-[6px] sm:text-xl">
               {{ usuario.iniciales }}
           </div>


       </div>


       <!-- INFORMACIÓN INFERIOR -->
       <div class="flex min-h-[75px] flex-col items-start justify-center gap-2 px-3 py-2 pl-20 sm:min-h-[76px] sm:flex-row sm:items-center sm:justify-between sm:gap-3 sm:px-8 sm:py-3 sm:pl-36">


           <!-- ANTIGÜEDAD -->
           <p class="font-lexend text-[9px] leading-tight text-acento/70 min-[380px]:text-[10px] sm:text-sm">
               {{ rol|capitalize }} desde {{ usuario.fecha_registro }}
           </p>


           <!-- BOTÓN EDITAR -->
           <button
               type="button"
               id="configuracion-perfil"
               aria-label="Configuración del perfil"
               class="ml-auto flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-acento text-white transition hover:opacity-80 sm:ml-0 sm:h-9 sm:w-9"
           >
               <i data-lucide="pencil-line" class="h-4 w-4 sm:h-5 sm:w-5"></i>
           </button>


       </div>


   </section>


   <!-- DATOS PERSONALES -->
   <section class="rounded-[18px] bg-white p-4 sm:p-6 lg:p-7">


       <div class="flex flex-col gap-4 sm:gap-5 lg:flex-row lg:justify-start lg:gap-0">


       <!-- EMAIL -->
       <div class="flex min-w-0 flex-col gap-1 lg:w-1/3 lg:pr-6">
           <p class="font-lexend text-[10px] font-semibold uppercase tracking-wide text-acento/70 sm:text-xs">
               Email
           </p>
           <p class="break-all font-lexend text-xs font-medium text-acento sm:text-sm">
               {{ usuario.email }}
           </p>
       </div>


       <!-- FECHA DE NACIMIENTO -->
       <div class="flex min-w-0 flex-col gap-1 border-t border-acento/20 pt-3 lg:w-1/3 lg:border-l lg:border-t-0 lg:px-6 lg:pt-0">
           <p class="font-lexend text-[10px] font-semibold uppercase tracking-wide text-acento/70 sm:text-xs">
               Fecha de nacimiento
           </p>
           <p class="font-lexend text-xs font-medium text-acento sm:text-sm">
               {{ usuario.fecha_nacimiento }}
           </p>
       </div>


       <!-- DOCUMENTO -->
       <div class="flex min-w-0 flex-col gap-1 border-t border-acento/20 pt-3 lg:w-1/3 lg:border-l lg:border-t-0 lg:pl-6 lg:pt-0">
           <p class="font-lexend text-[10px] font-semibold uppercase tracking-wide text-acento/70 sm:text-xs">
               Documento
           </p>
           <p class="font-lexend text-xs font-medium text-acento sm:text-sm">
               {{ usuario.documento }}
           </p>
       </div>


   </div>


   </section>


</div>
