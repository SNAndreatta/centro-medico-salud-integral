<div class="flex flex-col gap-7">
    <section class="relative overflow-hidden rounded-[20px] bg-white">
        <div class="h-28 bg-acento"></div>
        <div class="absolute left-5 top-16 flex h-20 w-20 items-center justify-center rounded-full border-[6px] border-white bg-acento font-lexend text-xl font-semibold text-white sm:left-8">
            {{ usuario.iniciales }}
        </div>
        <div class="absolute left-28 right-5 top-0 flex h-28 items-end sm:left-32">
            <h1 class="break-words font-gelasio text-2xl font-semibold text-white sm:text-3xl mb-2">
                {{ usuario.nombre }} {{ usuario.apellido }}
            </h1>
        </div>
        <div class="flex min-h-16 items-start justify-between gap-4 pl-28 pr-5 sm:pl-32 sm:pr-8 mt-2">
            <p class="font-lexend text-xs text-acento/70 sm:text-sm">
                {{ rol|capitalize }} desde {{ usuario.fecha_registro }}
            </p>
            <button type="button" id="configuracion-perfil" aria-label="Configuración del perfil"
                    class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-acento text-white transition hover:opacity-80">
                <i data-lucide="pencil-line" class="h-5 w-5"></i>
            </button>
        </div>
    </section>

    <section class="rounded-[18px] bg-white p-5 sm:p-7">
        <div class="grid grid-cols-1 gap-3 sm:flex sm:justify-between sm:gap-0">
            <div class="flex min-w-0 flex-col gap-1">
                <p class="font-lexend text-xs font-semibold uppercase tracking-wide text-acento/70">Email</p>
                <p class="break-words font-lexend text-xs font-medium text-acento sm:text-sm">{{ usuario.email }}</p>
            </div>
            <div class="hidden border-l border-acento/20 sm:flex"></div>
            <div class="flex min-w-0 flex-col gap-1">
                <p class="font-lexend text-xs font-semibold uppercase tracking-wide text-acento/70">Fecha de nacimiento</p>
                <p class="break-words font-lexend text-xs font-medium text-acento sm:text-sm">{{ usuario.fecha_nacimiento }}</p>
            </div>
            <div class="hidden border-l border-acento/20 sm:flex"></div>
            <div class="flex min-w-0 flex-col gap-1">
                <p class="font-lexend text-xs font-semibold uppercase tracking-wide text-acento/70">Documento</p>
                <p class="break-words font-lexend text-xs font-medium text-acento sm:text-sm">{{ usuario.documento }}</p>
            </div>
        </div>
    </section>

</div>
