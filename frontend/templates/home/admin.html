<div class="rounded-xl bg-dominante">

    {% include "components/mensajes.html" %}

    <!-- Información del usuario -->
    <div class="mb-7 flex min-h-12 flex-col justify-center gap-1 rounded-2xl bg-acento px-5 py-3 text-white sm:flex-row sm:items-center sm:justify-between sm:gap-3 sm:px-7">

        <p class="min-w-0 truncate text-sm font-semibold font-gelasio sm:text-xl">
            {{ usuario.nombre_completo }}
        </p>

        <span class="shrink-0 font-lexend text-xs font-medium sm:text-base">
            Administración
        </span>

    </div>

    <!-- Menú administrativo -->
    <div class="space-y-8">

        <!-- Primer grupo -->
        <section class="overflow-hidden rounded-xl bg-white shadow-sm">

            <div class="h-6 bg-acento"></div>

            <a href="{{ url_for('rutas_admin_cobertura.obtener_coberturas') }}"
               class="flex items-center justify-between border-b border-gray-300 px-5 py-3 transition hover:bg-dominante">
                <span class="text-[10px] font-bold tracking-[0.15em] text-acento sm:text-xs">
                    COBERTURAS
                </span>
                <i data-lucide="chevron-right" class="h-6 w-6 text-acento"></i>
            </a>

            <a href="{{ url_for('rutas_admin_consultorio.obtener_consultorios') }}"
               class="flex items-center justify-between border-b border-gray-300 px-5 py-3 transition hover:bg-dominante">
                <span class="text-[10px] font-bold tracking-[0.15em] text-acento sm:text-xs">
                    CONSULTORIOS
                </span>
                <i data-lucide="chevron-right" class="h-6 w-6 text-acento"></i>
            </a>

            <a href="{{ url_for('rutas_admin_especialidad.obtener_especialidades') }}"
               class="flex items-center justify-between border-b border-gray-300 px-5 py-3 transition hover:bg-dominante">
                <span class="text-[10px] font-bold tracking-[0.15em] text-acento sm:text-xs">
                    ESPECIALIDADES
                </span>
                <i data-lucide="chevron-right" class="h-6 w-6 text-acento"></i>
            </a>

            <a href="{{ url_for('rutas_admin_usuario.obtener_usuarios') }}"
               class="flex items-center justify-between border-b border-gray-300 px-5 py-3 transition hover:bg-dominante">
                <span class="text-[10px] font-bold tracking-[0.15em] text-acento sm:text-xs">
                    USUARIOS
                </span>
                <i data-lucide="chevron-right" class="h-6 w-6 text-acento"></i>
            </a>

        </section>

        <!-- Segundo grupo -->
        <section class="overflow-hidden rounded-xl bg-white shadow-sm">

            <div class="h-6 bg-acento"></div>

            <a href="{{ url_for('rutas_admin_sala_espera.sala_espera') }}"
               class="flex items-center justify-between border-b border-gray-300 px-5 py-3 transition hover:bg-dominante">
                <span class="text-[10px] font-bold tracking-[0.15em] text-acento sm:text-xs">
                    SALA DE ESPERA
                </span>
                <i data-lucide="chevron-right" class="h-6 w-6 text-acento"></i>
            </a>

            <a href="{{ url_for('rutas_admin_turnos_especialidad.turnos_especialidad') }}"
               class="flex items-center justify-between border-b border-gray-300 px-5 py-3 transition hover:bg-dominante">
                <span class="text-[10px] font-bold tracking-[0.15em] text-acento sm:text-xs">
                    TURNOS
                </span>
                <i data-lucide="chevron-right" class="h-6 w-6 text-acento"></i>
            </a>

            <a href="{{ url_for('rutas_admin_ausentismo.ausentismo') }}"
               class="flex items-center justify-between border-b border-gray-300 px-5 py-3 transition hover:bg-dominante">
                <span class="text-[10px] font-bold tracking-[0.15em] text-acento sm:text-xs">
                    ESTADÍSTICAS DE AUSENTISMO
                </span>
                <i data-lucide="chevron-right" class="h-6 w-6 text-acento"></i>
            </a>

            <a href="{{ url_for('rutas_admin_disponibilidad_consultorios.disponibilidad_consultorios') }}"
               class="flex items-center justify-between border-b border-gray-300 px-5 py-3 transition hover:bg-dominante">
                <span class="text-[10px] font-bold tracking-[0.15em] text-acento sm:text-xs">
                    DISPONIBILIDAD DE CONSULTORIOS
                </span>
                <i data-lucide="chevron-right" class="h-6 w-6 text-acento"></i>
            </a>

            <a href="{{ url_for('rutas_admin_tiempo_espera.tiempo_espera') }}"
               class="flex items-center justify-between px-5 py-3 transition hover:bg-dominante">
                <span class="text-[10px] font-bold tracking-[0.15em] text-acento sm:text-xs">
                    TIEMPOS DE ESPERA
                </span>
                <i data-lucide="chevron-right" class="h-6 w-6 text-acento"></i>
            </a>

        </section>

        <!-- Generación de turnos: habilitada sólo el día 15 de cada mes -->
        <div class="mt-8 flex justify-end px-5 pb-2">
            <form method="post" action="{{ url_for('rutas_home.generar_turnos') }}">
                <button type="submit"
                        {% if not puede_generar_turnos %}disabled aria-disabled="true"{% endif %}
                        title="{% if puede_generar_turnos %}Generar los turnos del próximo mes{% else %}Disponible sólo el día 15 de cada mes{% endif %}"
                        class="inline-flex items-center gap-2 rounded-full px-5 py-3 font-lexend text-sm font-semibold text-white
                               {% if puede_generar_turnos %}
                               bg-acento transition hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-acento focus:ring-offset-2
                               {% else %}
                               bg-acento/50 cursor-not-allowed
                               {% endif %}">
                    <i data-lucide="calendar-plus" class="h-4 w-4"></i>
                    Crear turnos
                </button>
            </form>
        </div>
    </div>
</div>
