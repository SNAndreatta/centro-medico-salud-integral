<!-- Información del usuario -->
<div class="mb-7 flex min-h-12 items-center justify-between gap-2 rounded-2xl bg-acento px-4 py-3 text-white sm:gap-3 sm:px-7">

    <p class="min-w-0 truncate text-xs font-semibold font-gelasio sm:text-lg">
        {{ usuario.nombre_completo | default('Nombre Completo') }}
    </p>

    <span class="shrink-0 font-lexend text-xs font-medium sm:text-base">
        Recepción
    </span>

</div>


<!-- Opciones principales -->
<nav aria-label="Menú principal de paciente" class="space-y-5 sm:space-y-6">

    <!-- Ver turnos -->
    <a
        href="{{ url_for('rutas_recepcion.ver_turnos') }}"
        class="group flex min-h-16 items-center justify-between gap-2 rounded-2xl bg-white px-4 py-5 transition hover:bg-gray-100 hover:shadow-md sm:min-h-[84px] sm:gap-4 sm:px-7"
    >

        <span class="min-w-0 break-words text-xs font-bold font-lexend tracking-wide text-acento sm:text-xl lg:text-2xl">
            VER TURNOS
        </span>

        <i
            data-lucide="clock"
            class="h-6 w-6 shrink-0 text-acento transition group-hover:scale-110 sm:h-10 sm:w-10"
        ></i>

    </a>


    <!-- Ver sala de espera -->
    <a
        href="{{ url_for('rutas_sala_espera.sala_espera') }}"
        class="group flex min-h-16 items-center justify-between gap-2 rounded-2xl bg-white px-4 py-5 transition hover:bg-gray-100 hover:shadow-md sm:min-h-[84px] sm:gap-4 sm:px-7"
    >

        <span class="min-w-0 break-words text-xs font-bold font-lexend tracking-wide text-acento sm:text-xl lg:text-2xl">
            VER SALA DE ESPERA
        </span>

        <i
            data-lucide="clipboard-clock"
            class="h-6 w-6 shrink-0 text-acento transition group-hover:scale-110 sm:h-10 sm:w-10"
        ></i>

    </a>


    <!-- Ver pacientes -->
    <a
        href="{{ url_for('rutas_recepcion.ver_pacientes') }}"
        class="group flex min-h-16 items-center justify-between gap-2 rounded-2xl bg-white px-4 py-5 transition hover:bg-gray-100 hover:shadow-md sm:min-h-[84px] sm:gap-4 sm:px-7"
    >

        <span class="min-w-0 break-words text-xs font-bold font-lexend tracking-wide text-acento sm:text-xl lg:text-2xl">
            VER PACIENTES
        </span>

        <i
            data-lucide="users"
            class="h-6 w-6 shrink-0 text-acento transition group-hover:scale-110 sm:h-10 sm:w-10"
        ></i>

    </a>
</nav>
