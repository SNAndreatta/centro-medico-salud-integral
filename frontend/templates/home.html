<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio | Salud Integral</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>


<body class="min-h-screen bg-dominante font-sans text-acento antialiased">

    <!-- Encabezado compartido -->
    <header class="mx-auto flex w-full max-w-[1100px] items-center justify-between px-5 py-7 sm:px-10">

        <div class="flex items-center gap-2.5">

            <div class="flex h-10 w-10 items-center justify-center rounded-md bg-acento text-white">
                <i data-lucide="activity" class="h-7 w-7"></i>
            </div>

            <div>
                <p class="text-[8px] font-medium font-lexend tracking-[0.16em] text-slate-500">
                    CENTRO MÉDICO DE
                </p>

                <h2 class="font-gelasio text-2xl font-bold leading-tight sm:text-3xl">
                    Salud Integral
                </h2>
            </div>

        </div>


        <!-- Perfil -->
        <a href="#perfil">
            <i data-lucide="circle-user-round" class="h-10 w-10"></i>
        </a>

    </header>


    <!-- Contenido según el rol -->
    <main class="mx-auto w-full max-w-[1100px] px-5 pb-10 sm:px-10">

        {% if rol == "medico" %}

            {% include "home/medico.html" %}

        {% elif rol == "recepcion" %}

            {% include "home/recepcion.html" %}

        {% elif rol == "paciente" %}

            {% include "home/paciente.html" %}

        {% elif rol == "admin" %}

            {% include "home/admin.html" %}

        {% endif %}

    </main>


    <!-- JavaScript compartido -->
    <body data-rol="{{ rol }}">

        <!-- Todo el contenido que ya tenías en el body -->

        <script>
            lucide.createIcons();
        </script>

        <script src="{{ url_for('static', filename='js/home.js') }}"></script>

    </body>

</body>
</html>
